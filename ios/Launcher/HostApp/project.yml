# XcodeGen spec for the launcher test host (not shipped). Run `xcodegen` in this folder.
#
# The host mimics how the engine runs on iOS: a UIScene delegate that, like SDL3's
# SDLUIKitSceneDelegate, shows a launch window and then calls "main" from a run-loop timer
# (performSelector:afterDelay:0). "main" calls the C entry point gx_launcher_run() through
# ../GXLauncher/include/gx_launcher.h -- exactly what the engine will do -- and then lists the
# returned arguments, the environment and the files written, so the contract can be checked
# without the game.
name: GXLauncherHost
options:
  bundleIdPrefix: dev.generalsx
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  GXLauncher:
    path: ../GXLauncher
targets:
  GXLauncherHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: GXLauncher
        product: GXLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.generalsx.launcherhost
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/HostApp-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../GXLauncher/include
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GX Launcher Host
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).HostSceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
